name: selftest

# 하네스 워킹카피가 없어도 도는 것만 검사한다.
# 원장 생성은 target/tasks/ 가 있어야 하므로 여기서 돌리지 않는다 — 로컬에서 돌린다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 회귀 테스트
        run: node scripts/selftest.cjs
      # 원장은 레포에 담지 않는다 — 사람마다 자기 하네스의 과업을 봐야 하고,
      # 커밋하면 pull 한 사람이 남의 과업을 보거나 서로 덮어쓴다.
      - name: 원장이 레포에 섞여 들어오지 않았는가
        run: |
          if [ -f web/ledger.json ]; then
            echo "web/ledger.json 이 커밋됐다 — 사람마다 달라지는 파일이라 담지 않는다"; exit 1
          fi
          echo "원장 미커밋 확인"
      # 그린존 산출물은 담는다(공유 대상). 대신 경로가 실리지 않았는지 본다.
      - name: 그린존 산출물에 파일 경로가 실리지 않았는가
        run: |
          if grep -rqE '[A-Za-z]:[\\/]|/Users/|/home/' greenzone/ 2>/dev/null; then
            echo "그린존 산출물에 파일 경로가 실렸다 — 공개 레포로 나가면 안 된다"; exit 1
          fi
          echo "경로 0건"
